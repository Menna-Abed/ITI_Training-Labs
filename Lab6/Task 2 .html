<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Students_Task2</title>
</head>
<body>
<script>

var students = [
    { fname: 'ali', age: 22, grade: 100 },
    { fname: 'nora', age: 20, grade: 90 },
    { fname: 'nada', age: 25, grade: 75 },
    { fname: 'heba', age: 19, grade: 50 },
    { fname: 'bassem', age: 21, grade: 40 }
];

// 1 

students.map(function(elm) {
    document.write(  elm.fname + " : " + elm.age + " : " + elm.grade + "<br><br>" );
});

document.write("<h2 style='color:red'>students have grade greater than 80</h2>");


// 2 

res = students.filter(function(elm) { return elm.grade > 80;});
res.map(function(elm) {
    document.write( elm.fname + " : " + elm.age + " : " + elm.grade + "<br><br>" );
});
document.write("<h2 style='color:red'>students ordered ascending by names</h2>");


// 3 

students.sort(function(a, b) {

    if (a.fname.toLowerCase() > b.fname.toLowerCase()) {
        return 1;
    }
    else {
        return -1;
    }

});
students.map(function(elm) { document.write(
        elm.fname + " : " + elm.age + " : " + elm.grade + "<br><br>"
    );

});

</script>
</body>
</html>
