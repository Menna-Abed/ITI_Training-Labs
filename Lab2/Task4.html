 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <title>Registration Form_Task4</title>
</head>
<body>

<form>

<table align="center" cellpadding="10">

    <tr>
        <td colspan="2">
            <h1>Registration</h1>
        </td>
    </tr>

    <tr>
        <td>
            <label><b>Full Name</b></label><br><br>
            <input type="text" placeholder="Enter your name" size="35">
        </td>

        <td>
            <label><b>Username</b></label><br><br>
            <input type="text" placeholder="Enter your username" size="35">
        </td>
    </tr>

    <tr>
        <td>
            <label><b>Email</b></label><br><br>
            <input type="email" placeholder="Enter your email" size="35">
        </td>

        <td>
            <label><b>Phone Number</b></label><br><br>
            <input type="tel" placeholder="Enter your number" size="35">
        </td>
    </tr>

    <tr>
        <td>
            <label><b>Password</b></label><br><br>
            <input type="password" placeholder="Enter your password" size="35">
        </td>

        <td>
            <label><b>Confirm Password</b></label><br><br>
            <input type="password" placeholder="Confirm your password" size="35">
        </td>
    </tr>

    <tr>
        <td colspan="2">
            <h2>Gender</h2>
        </td>
    </tr>

    <tr>
        <td colspan="2">
            <input type="radio" name="gender"> Male

            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

            <input type="radio" name="gender"> Female

            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

            <input type="radio" name="gender"> Prefer not to say
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <br>
            <input type="submit" value="Register" size="50">
        </td>
    </tr>

</table>

</form>

</body>

</html>
