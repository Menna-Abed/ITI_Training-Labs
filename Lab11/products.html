<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <title>Products</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background-color: #f4f7f6;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        a {
            color: white;
            background-color: #007bff;
            padding: 10px;
            text-decoration: none;
            border-radius: 15px;
        }
        #products {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }
        .product {
            width: 200px;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: white;
            text-align: center;
             border-radius: 10px;
        }
        .product img {
            width: 120px;
            height: 150px;
        }
        .product h3 {
            font-size: 15px;
        }
        .product p {
            font-size: 14px;
            font-weight: bold;
        }
        button {
            padding: 8px;
            margin: 5px;
            border: none;
            color: white;
            background-color: #28a745;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <h1>Products</h1>
    <a href="cart.html">Go To Cart</a>
    <div id="products"></div>
    <script src="products.js"></script>
</body>
</html>
