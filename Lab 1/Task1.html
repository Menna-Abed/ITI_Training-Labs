<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Example of Font Tag in HTML-Task1</title>
</head>
<body>

    <h2>Example of Font Tag in HTML</h2>

    <p>General text without any Font tag attribute value</p>

    <p><font color="#E5A73B">Text having normal font size and font face . Only changing font color</font></p>

    <p><font face="Comic Sans MS">Text having different font face.</font></p>

    <p><font size="4">Text with Increased font size having default font type.</font></p>

</body>
</html>
