<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shapes-Task2</title>
</head>
<body>
<script>
    class Shape {
        calcArea() {
            return 0;
        }
    }
    class Rectangle extends Shape {
        constructor(_width, _height) {
            super();
            this.width = _width;
            this.height = _height;
        }
        calcArea() {
            return this.width * this.height;
        }
    }

    class Circle extends Shape {
        constructor(_radius) {
            super();
            this.radius = _radius;
        }
        calcArea() {
            return 3.14 * this.radius * this.radius;
        }
    }

    let shapes = [
        new Rectangle(10, 5),
        new Circle(7),
        new Rectangle(4, 6),
        new Circle(5)
    ];
    for (let i = 0; i < shapes.length; i++) {
        document.write(shapes[i].calcArea() + "<br>");
    }

</script>

</body>
</html>
